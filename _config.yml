Parte 2: cambia estas dos líneas sueltas

Más abajo en el archivo:

theme_mode: dark # [light | dark]

/github.com/b4rp.png

avatar usa tu foto de GitHub. Si después quieres otra imagen, súbela a assets/img/avatar.png y cambia el valor a /assets/img/avatar.png.

Detalles

- url debe ir sin / al final: "https://b4rp.github.io".
- email: lo dejé vacío para que tu correo no quede público en el sitio. Si quieres mostrarlo, ponlo ahí.
- theme_mode: dark fija el modo oscuro, que queda bien con el estilo de tu perfil. Si lo dejas vacío, el sitio sigue la preferencia del sistema del visitante y aparece un botón para cambiar entre claro y oscuro.
- links: el primer enlace se usa como dueño del copyright en el pie de página, por eso puse primero GitHub.
- Indentación: YAML es estricto con los espacios. Usa siempre 2 espacios y nunca tabulaciones, o el build fallará.

Cuando hagas el commit, revisa la pestaña Actions. Si sale en rojo, pégame el error.

