    const bx = u * u * R[0] + 2 * u * s * Cp[0] + s * s * T[0], by = u * u * R[1] + 2 * u * s * Cp[1] + s * s * T[1];
    const tx = 2 * u * (Cp[0] - R[0]) + 2 * s * (T[0] - Cp[0]), ty = 2 * u * (Cp[1] - R[1]) + 2 * s * (T[1] - Cp[1]);
    const tl = Math.hypot(tx, ty) + 1e-9, nx = -ty / tl, ny = tx / tl;
    const w1 = Math.sin(TAU * (1.3 * s - t / LOOP) + S.ph);
    const w2 = Math.sin(TAU * (2.6 * s - 2 * t / LOOP) + S.ph * 1.7);
    const d = WAVE * S.amp * (Math.pow(s, 1.35) * w1 + 0.35 * s * s * w2);
    pts.push([bx + nx * d, by + ny * d]);
    const twist = 0.78 + 0.22 * Math.sin(TAU * (1.7 * s - t / LOOP) + S.ph + 1);
    hws.push(S.width * (0.7 + 0.3 * Math.sin(Math.PI * Math.min(1, s * 1.2))) * twist * (1 - 0.25 * s));
  }
  return { pts, hws };
}

function cloth(pts, hws, t, k, tatter, ph) {
  brush(pts, hws, pts.length === 20 ? AV : lin(pts.length), (i, a, q, r, c) => {
    const thr = tatter ? smoothstep(0.82, 1.0, a) : 0;
    if (thr > 0) {
      const hn = hash3(Math.floor(a * 55), Math.floor((q + 1) * 2.5), k + 7) % 1000 / 1000;
      if (hn < thr * 0.45 || Math.abs(q) > 1 - 0.35 * thr * (hash3(Math.floor(a * 40), k, 3) % 1000 / 1000)) return;
    }
    const crest = 0.5 + 0.5 * Math.cos(TAU * (1.3 * a - t / LOOP) + ph + Math.PI / 2);
    const across = 0.92 + 0.08 * Math.cos(q * Math.PI);
    const rolled = 1 - 0.22 * smoothstep(0.72, 1, Math.abs(q));
    const l = (0.4 + 0.32 * crest) * across * rolled;
    const col = lerp3(RED_DARK, RED, 0.2 + 0.8 * crest);
    set(i, l, col);
    glyph[i] = FABRIC + Math.max(0, Math.min(4, Math.floor((l - 0.26) / 0.1)));
    return;
    set(i, l, col);
  });
}

function scarf(t) {
  STRANDS.forEach((S, k) => { const { pts, hws } = strandPoints(S, t, k); cloth(pts, hws, t, k, true, S.ph); });
  const wob = 0.35 * Math.sin(TAU * t / LOOP);
  WRAP.forEach((P, k) => cloth(P.pts.map(([x, y], i) => [x, y + wob * Math.sin(i * 1.3 + k)]), P.hws, t, 9 + k, false, 0.7 + k));
  const NP = 22;
  for (let p = 0; p < NP; p++) {
    const S = STRANDS[p % STRANDS.length];
    const ph = ((t / (LOOP * 2) + p / NP) % 1 + 1) % 1;
    const { pts } = strandPoints(S, t, p % STRANDS.length);
    const at = pts[Math.min(19, 14 + (hash3(p, 2, 9) % 6))];
    const dir = [S.tip[0] - S.ctrl[0], S.tip[1] - S.ctrl[1]], dl = Math.hypot(dir[0], dir[1]);
    const dist = ph * (6 + 10 * rnd(p, 3));
    const x = at[0] + dir[0] / dl * dist + 1.5 * Math.sin(TAU * ph * 2 + p);
    const y = at[1] + dir[1] / dl * dist - ph * (2 + 4 * rnd(p, 4));
    const c = Math.floor(x * 2), r = Math.floor(y);
    if (c < 0 || c >= COLS || r < 0 || r >= ROWS) continue;
    const i = r * COLS + c, l = 0.68 * (1 - 0.7 * ph) * smoothstep(0, 0.08, ph);
    if (l > lum[i]) { set(i, l, RED); glyph[i] = FABRIC; }
  }
}

const G_PIPE = 0, G_SLASH = 1, G_BACK = 2, G_TICK = 3, G_COMMA = 4, G_DOT = 5;
const H0 = ROWS * HORIZON;
const P2 = 2 * LOOP;
const BLADES = [];
for (let k = 0, n = Math.round(COLS * 5.5); k < n; k++) {
  const depth = Math.pow(rnd(k, 1), 0.75);
  BLADES.push({ x: rnd(k, 2) * COLS * 0.5, y: H0 + depth * (ROWS + 3 - H0), depth,
    h: (0.8 + 10 * GRASS_HEIGHT * depth * depth) * (0.45 + 1.0 * Math.pow(rnd(k, 3), 1.4)) * (0.8 + 0.2 * GRASS_HEIGHT), lean0: 0.15 + (rnd(k, 4) - 0.5) * 0.35, ph: rnd(k, 5) * TAU,
    tint: rnd(k, 6) });
}
BLADES.sort((a, b) => a.y - b.y);
const FRONT_FROM = BLADES.findIndex((B) => B.y > ROWS - 4);
function wind(x, t) {
  const gust = Math.pow(0.5 + 0.5 * Math.sin(TAU * (x / 60 - t / P2)), 3);
  return GRASS_WIND * (0.18 + 0.55 * gust + 0.12 * Math.sin(TAU * (x / 17 - 2 * t / P2) + 1.3));
}
function blades(t, from, to) {
  for (let k = from; k < to; k++) {
    const B = BLADES[k], w = wind(B.x, t);
    let lean = B.lean0 + w * (0.6 + 0.6 * B.depth)
      + (0.35 * Math.sin(TAU * 3 * t / P2 + B.ph) + 0.15 * Math.sin(TAU * 5 * t / P2 + B.ph * 1.7)) * (0.5 + B.depth);
    lean = Math.max(-1.1, Math.min(1.5, lean));
    const sheen = Math.pow(0.5 + 0.5 * Math.sin(TAU * (B.x / 60 - t / P2) - 0.3), 3);
    const h = k >= FRONT_FROM && FRONT_FROM >= 0 ? Math.min(B.h, 10) : B.h;
    const steps = Math.max(1, Math.round(h));
    for (let s = 0; s <= steps; s++) {
      const u = s / steps;
      const x = B.x + lean * h * 0.55 * u * u, y = B.y - h * u;
      const r = Math.floor(y), c = Math.floor(x * 2);
      if (r < 0 || r >= ROWS || c < 0 || c >= COLS) continue;
      const i = r * COLS + c;
      const slope = 2.2 * lean * u;
      const g = B.depth < 0.1 ? (u > 0.5 ? G_TICK : G_DOT) : u > 0.9 && steps > 2 ? (slope > 0.5 ? G_TICK : G_COMMA)
        : slope > 0.6 ? G_SLASH : slope < -0.6 ? G_BACK : G_PIPE;
      const l = (0.12 + 0.32 * B.depth) * (0.7 + 0.3 * u) * (0.75 + 0.7 * sheen * u);
      let col = lerp3(GRASS_FAR, GRASS_NEAR, B.depth);
      col = lerp3(col, GRASS_TIP, u * u * (0.25 + 0.35 * B.tint) + 0.45 * sheen * u);
      if (l >= lum[i]) { set(i, l, col); glyph[i] = g; }
    }
  }
}
const FLUFF = Array.from({ length: Math.round(COLS / 3.5) }, (_, k) => ({
  k, x0: rnd(k, 11) * COLS * 0.5, y0: H0 * (0.25 + 0.95 * rnd(k, 12)), laps: 1 + (k % 2), bob: 1 + 3 * rnd(k, 13), ph: rnd(k, 14) * TAU }));
function fluff(t) {
  const span = COLS * 0.5;
  for (const F of FLUFF) {
    const x = (F.x0 + span * F.laps * t / P2) % span;
    const y = F.y0 + F.bob * Math.sin(TAU * t / P2 + F.ph);
    const r = Math.floor(y), c = Math.floor(x * 2);
    if (r < 0 || r >= ROWS || c < 0 || c >= COLS) continue;
    const i = r * COLS + c;
    if (lum[i] < 0.1) { set(i, 0.42, GRASS_TIP); glyph[i] = F.k % 3 ? G_DOT : FABRIC; }
  }
}

const CLOAK_PAD = 8;
const cloakW = new Float32Array(KR * (KC + CLOAK_PAD));
for (let r = 0; r < KR; r++) for (let c = 0; c < KC + CLOAK_PAD; c++) {
  cloakW[r * (KC + CLOAK_PAD) + c] = smoothstep(KC * 0.63, KC * 0.97, c)
    * smoothstep(12, 22, r) * (1 - smoothstep(96, 106, r)) * (0.6 + 0.4 * smoothstep(40, 90, r));
}
function sampleKnight(x, y) {
  if (x < 0 || y < 0 || x > KC - 1 || y > KR - 1) return 0;
  const c0 = Math.floor(x), r0 = Math.floor(y), c1 = Math.min(KC - 1, c0 + 1), r1 = Math.min(KR - 1, r0 + 1);
  const fx = x - c0, fy = y - r0;
  return (knightLum[r0 * KC + c0] * (1 - fx) + knightLum[r0 * KC + c1] * fx) * (1 - fy)
       + (knightLum[r1 * KC + c0] * (1 - fx) + knightLum[r1 * KC + c1] * fx) * fy;
}

function scene(t) {
  lum.fill(0); glyph.fill(-1); isKnight.fill(0);
  blades(t, 0, FRONT_FROM < 0 ? BLADES.length : FRONT_FROM);
  fluff(t);
  const breath = BREATH * (0.5 - 0.5 * Math.cos(TAU * t / P2));
  const sway = SWAY * Math.sin(TAU * t / P2 + 0.8);
  for (let r = 0; r < KR; r++) {
    const wgt = smoothstep(KR * 0.92, KR * 0.35, r);
    const rowLift = r + breath * wgt, rowSway = sway * wgt * wgt;
    for (let c = 0; c < KC + CLOAK_PAD; c++) {
      const tc = c + KX;
      if (tc >= COLS) break;
      const w = cloakW[r * (KC + CLOAK_PAD) + c];
      let dx = 0, dy = 0;
      if (w > 0) {
        dx = CLOAK * w * (0.35 + 0.55 * Math.sin(TAU * (t / LOOP - r / 22 - c / 45))
                         + 0.3 * Math.sin(TAU * (2 * t / LOOP - r / 9) + 1.1));
        dy = 0.35 * CLOAK * w * Math.sin(TAU * (t / LOOP - c / 16) + 0.5);
      }
      const sx = c - dx + rowSway, sy = rowLift - dy;
      const L = sampleKnight(sx, sy);
      const i = (r + KY) * COLS + tc, j = i * 3;
      if (L < 0.06) {
        const mr = Math.round(sy), mc = Math.round(sx);
        if (mr >= 0 && mr < KR && mc >= 0 && mc < KC && knightMask[mr * KC + mc]) lum[i] = 0;
        continue;
      }
      lum[i] = L; glyph[i] = -1; isKnight[i] = 1;
      rgb[j] = KNIGHT_RGB[0]; rgb[j + 1] = KNIGHT_RGB[1]; rgb[j + 2] = KNIGHT_RGB[2];
    }
  }
  if (FRONT_FROM >= 0) blades(t, FRONT_FROM, BLADES.length);
  scarf(t);
}

const view = document.getElementById("view"), ctx = view.getContext("2d");
const W = COLS * CW, H = ROWS * CH;
view.width = W; view.height = H;
const START = [], COUNT = BUCKETS.map((b) => b.length);
BUCKETS.reduce((s, b, k) => { START[k] = s; return s + b.length; }, 0);
const GRASS_CHARS = "|/\\',." + "+xX%&", GRASS0 = BUCKETS.join("").length;
const MASKS = [...BUCKETS.join("") + GRASS_CHARS].map((ch) => {
  const g = document.createElement("canvas"); g.width = CW; g.height = CH;
  const gx = g.getContext("2d");
  gx.font = FONT; gx.textBaseline = "middle"; gx.fillStyle = "#fff"; gx.fillText(ch, 0, CH / 2);
  const d = gx.getImageData(0, 0, CW, CH).data, m = new Uint8Array(CW * CH);
  for (let k = 0; k < m.length; k++) m[k] = d[k * 4 + 3];
  return m;
});
const ascii = document.createElement("canvas"); ascii.width = W; ascii.height = H;
const actx = ascii.getContext("2d");
const img = actx.createImageData(W, H), px32 = new Uint32Array(img.data.buffer);
const glowA = document.createElement("canvas"), glowB = document.createElement("canvas"), glowC = document.createElement("canvas");
[[glowA, 2], [glowB, 4], [glowC, 8]].forEach(([g, s]) => { g.width = Math.ceil(W / s); g.height = Math.ceil(H / s); });

function draw() {
  px32.fill(0);
  for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) {
    const i = r * COLS + c, L = lum[i];
    let m;
    if (glyph[i] >= 0) m = MASKS[GRASS0 + glyph[i]];
    else {
      let level = 0;
      while (level < LEVELS.length && L >= LEVELS[level]) level++;
      if (level === 0) continue;
      m = MASKS[START[level] + hash3(r, c, 1) % COUNT[level]];
    }
    const k = (isKnight[i] ? 0.9 : 0.6 + 0.45 * L) * 255, j = i * 3;
    const pr = Math.min(255, rgb[j] * k) | 0, pg = Math.min(255, rgb[j + 1] * k) | 0, pb = Math.min(255, rgb[j + 2] * k) | 0;
    const col = (pb << 16) | (pg << 8) | pr;
    let o0 = (r * CH) * W + c * CW, mi = 0;
    for (let y = 0; y < CH; y++, o0 += W) for (let x = 0; x < CW; x++, mi++) {
      const v = m[mi];
      if (v) px32[o0 + x] = (v << 24) | col;
    }
  }
  actx.putImageData(img, 0, 0);
  ctx.globalCompositeOperation = "source-over"; ctx.globalAlpha = 1;
  ctx.fillStyle = `rgb(${BG.join(",")})`; ctx.fillRect(0, 0, W, H);
  ctx.drawImage(ascii, 0, 0);
  if (GLOW > 0) {
    let src = ascii;
    for (const g of [glowA, glowB, glowC]) {
      const gx = g.getContext("2d");
      gx.clearRect(0, 0, g.width, g.height); gx.drawImage(src, 0, 0, g.width, g.height); src = g;
    }
    ctx.globalCompositeOperation = "lighter"; ctx.globalAlpha = GLOW;
    ctx.drawImage(glowC, 0, 0, W, H);
    ctx.globalCompositeOperation = "source-over"; ctx.globalAlpha = 1;
  }
}

let t0 = performance.now(), lastDraw = -1e9;
function tick(now) {
  if (now - lastDraw >= 1000 / FPS - 2) {
    lastDraw = now;
    scene((now - t0) / 1000);
    draw();
  }
  requestAnimationFrame(tick);
}
requestAnimationFrame(tick);

let resizeTimer = 0;
addEventListener("resize", () => {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(() => {
    const rows = Math.max(KNIGHT.rows, Math.min(260, Math.round(KNIGHT.cols * CW / CH * innerHeight / Math.max(1, innerWidth))));
    const cols = Math.max(KNIGHT.cols, Math.min(560, fitCols(rows)));
    if (Math.abs(cols - COLS) > 4 || Math.abs(rows - ROWS) > 4) location.reload();
  }, 400);
});
</script>
</body>
